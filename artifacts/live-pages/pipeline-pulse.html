<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pipeline Pulse</title><style id="pp-style">
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface-2: #f1efe9;
    --border: #e4e1d8;
    --text: #201f1c;
    --text-muted: #6f6b62;
    --text-faint: #9d998e;
    --accent: #4650c9;
    --accent-soft: #eceafb;
    --accent-strong: #363da3;
    --accent-ink: #ffffff;
    --new: #1f8a5c;
    --new-soft: #e4f5ec;
    --updated: #b3760e;
    --updated-soft: #faf0dc;
    --stale: #c23f3f;
    --stale-soft: #fbe9e9;
    --shadow: 0 1px 2px rgba(32, 31, 28, 0.04), 0 8px 24px -12px rgba(32, 31, 28, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --surface: #1e1e24;
      --surface-2: #26262e;
      --border: #34343d;
      --text: #eeeeef;
      --text-muted: #a3a2ab;
      --text-faint: #77767f;
      --accent: #8b93f5;
      --accent-soft: #262a4a;
      --accent-strong: #aeb4f8;
      --accent-ink: #16161a;
      --new: #4fbf8c;
      --new-soft: #163427;
      --updated: #e0a53d;
      --updated-soft: #3a2d14;
      --stale: #e2726f;
      --stale-soft: #3c2020;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #16161a;
    --surface: #1e1e24;
    --surface-2: #26262e;
    --border: #34343d;
    --text: #eeeeef;
    --text-muted: #a3a2ab;
    --text-faint: #77767f;
    --accent: #8b93f5;
    --accent-soft: #262a4a;
    --accent-strong: #aeb4f8;
    --accent-ink: #16161a;
    --new: #4fbf8c;
    --new-soft: #163427;
    --updated: #e0a53d;
    --updated-soft: #3a2d14;
    --stale: #e2726f;
    --stale-soft: #3c2020;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Sora', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0;
  }

  .freshness-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .freshness {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: var(--shadow);
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--new);
    flex-shrink: 0;
  }
  .dot.stale { background: var(--stale); }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 999px;
    padding: 9px 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  .refresh-btn:hover { opacity: 0.88; }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-btn svg { width: 14px; height: 14px; }

  .request-note {
    font-size: 0.78rem;
    color: var(--text-faint);
    margin: -10px 0 24px;
    min-height: 1.2em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .stat .n {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.6rem;
    font-weight: 500;
    line-height: 1.1;
  }

  .stat .l {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel h2 {
    font-family: 'Sora', system-ui, sans-serif;
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel h2 .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    background: var(--surface-2);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .empty {
    padding: 28px 18px 32px;
    color: var(--text-faint);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .item {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }

  .item .row1 {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
  }

  .item .name {
    font-weight: 500;
    font-size: 0.92rem;
  }

  .item .time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .item .meta {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-top: 3px;
  }

  .pill {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .pill.new { background: var(--new-soft); color: var(--new); }
  .pill.updated { background: var(--updated-soft); color: var(--updated); }

  .stage-bars { display: flex; flex-direction: column; gap: 10px; }
  .stage-row { display: flex; align-items: center; gap: 12px; }
  .stage-name { flex: 0 0 140px; font-size: 0.85rem; color: var(--text-muted); }
  .stage-bar-track { flex: 1 1 auto; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .stage-bar-fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

    if (!s) return null;

  function fmtDate(d) {
    if (!d) return null;

  function daysAgo(d) {
    if (!d) return null;
    var ms = Date.now() - d.getTime();
    var days = Math.floor(ms / 86400000);

    if (days === 0) return 'today';

    return days + ' days ago';

  function formatMeetingTime(hhmm) {
    if (!hhmm) return '';

    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + mins + ' ' + ap;

  function normalizeBiz(s) {
    if (!s) return '';

      .replace(/[.,''"]/g, '')

      .replace(/[^a-z0-9]+/g, ' ')

  function matchProspect(meeting, state) {
    var email = (meeting.email || '').toLowerCase().trim();
    var biz = normalizeBiz(meeting.business);
    var lead = null, opportunity = null, contact = null, account = null;

    Object.keys(state.seenLeads || {}).forEach(function (k) {
      if (lead) return;
      var l = state.seenLeads[k];
      if (l.email && email && l.email.toLowerCase().trim() === email) lead = Object.assign({ _key: k }, l);
    });
    if (!lead && biz) {
      Object.keys(state.seenLeads || {}).forEach(function (k) {
        if (lead) return;
        var l = state.seenLeads[k];
        if (l.company && normalizeBiz(l.company) === biz) lead = Object.assign({ _key: k }, l);
      });
    }

    Object.keys(state.seenContacts || {}).forEach(function (k) {
      if (contact) return;
      var c = state.seenContacts[k];
      if (c.email && email && c.email.toLowerCase().trim() === email) contact = Object.assign({ _key: k }, c);
    });
    if (!contact && biz) {
      Object.keys(state.seenContacts || {}).forEach(function (k) {
        if (contact) return;
        var c = state.seenContacts[k];
        if (c.account && normalizeBiz(c.account) === biz) contact = Object.assign({ _key: k }, c);
      });
    }

    if (biz) {
      Object.keys(state.seenOpportunities || {}).forEach(function (k) {
        if (opportunity) return;
        var o = state.seenOpportunities[k];
        if (o.account && normalizeBiz(o.account) === biz) opportunity = Object.assign({ _key: k }, o);
      });
    }

    // Resolve an Account record from whichever biz name we can find: the meeting's own
    // business field, or the account name attached to a matched contact/opportunity.
    var accountNameToTry = biz || normalizeBiz((contact && contact.account) || (opportunity && opportunity.account));
    if (accountNameToTry) {
      Object.keys(state.seenAccounts || {}).forEach(function (k) {
        if (account) return;
        var a = state.seenAccounts[k];
        if (a.name && normalizeBiz(a.name) === accountNameToTry) account = Object.assign({ _key: k }, a);
      });
    }

    return { lead: lead, opportunity: opportunity, contact: contact, account: account };

  function opportunitiesByStage(state) {
    var order = state.stageOrder || [];
    var byStage = {};
    order.forEach(function (s) { byStage[s] = []; });
    Object.keys(state.seenOpportunities).forEach(function (k) {
      var v = state.seenOpportunities[k];
      var stage = v.stage;
      if (!byStage[stage]) byStage[stage] = [];
      byStage[stage].push(Object.assign({ _key: k }, v));
    });
    order.forEach(function (s) {
      byStage[s].sort(function (a, b) {
        var da = parseLooseDate(a.lastUpdatedDate), db = parseLooseDate(b.lastUpdatedDate);
        if (da && db) return da.getTime() - db.getTime(); // oldest update first = most overdue
        if (da && !db) return -1;
        if (!da && db) return 1;
        return (a.account || a.name || '').localeCompare(b.account || b.name || ''); // fallback when neither has it
      });
    });
    return { order: order, byStage: byStage };
  }

  function wire() {
    var tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(function (tb) {
      tb.addEventListener('click', function () {
        var target = tb.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b === tb); });
        var pipelinePanel = document.getElementById('tabPipeline');
        var weekPanel = document.getElementById('tabWeek');
        if (pipelinePanel) pipelinePanel.classList.toggle('active', target === 'pipeline');
        if (weekPanel) weekPanel.classList.toggle('active', target === 'week');
      });
    });

    var btn = document.getElementById('refreshBtn');
    if (!btn) return;
    btn.addEventListener('click', async function () {
      btn.disabled = true;
      btn.textContent = 'Requesting…';
      var when = new Date().toLocaleString('en-US', {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
      var nextState = Object.assign({}, STATE, {
        refreshRequest: { when: when }
      });
      try {
        var artifact = window.claude ? await window.claude.use('artifact') : null;
        if (!artifact) {
          document.getElementById('requestNote').textContent =
            'Live refresh requests aren\'t available in this view — just ask Claude in the Pipeline Pulse chat directly.';
          btn.disabled = false;
          btn.innerHTML = btn.innerHTML.replace('Requesting…', 'Request refresh');
          return;
        }
        await artifact.publish(renderFullDocument(nextState));
        // On success the view reloads to the new version automatically.
      } catch (err) {
        var code = err && err.code;
        var note;
        if (code === 'conflict') {
          note = 'A Claude session just updated this dashboard — reloading to show the latest version\u2026';
        } else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') {
          note = 'This view is read-only, so it can\'t flag a refresh request here — ask in the Pipeline Pulse chat directly.';
        } else if (code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
          note = 'Live refresh requests aren\'t available in this view right now — just ask Claude in the Pipeline Pulse chat directly.';
        } else {
          note = 'Couldn\'t save the request (' + (code || 'unknown error') + '). Just ask Claude in the Pipeline Pulse chat directly.';
        }
        document.getElementById('requestNote').textContent = note;
        if (code !== 'conflict') {
          btn.disabled = false;
          btn.textContent = 'Request refresh';
        }
        // On 'conflict' the shell itself reloads this view to the winning version —
        // leave the button disabled rather than resetting it, since a reload is already coming.
      }
    });
  }

  paint();
})();</script></body></html>
